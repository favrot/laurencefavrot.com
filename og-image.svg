<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Laurence Favrot</title>
  <desc id="desc">I'm building systems that consider the whole person.</desc>
  <rect width="1200" height="630" fill="#1e1c19"/>
  <rect x="28" y="28" width="1144" height="574" rx="2" fill="none" stroke="#35322c" stroke-width="2"/>

  <text x="84" y="105" fill="#d9a05b" font-family="Georgia, 'Times New Roman', serif" font-size="27">Laurence Favrot</text>

  <text x="84" y="252" fill="#e8e2d6" font-family="Georgia, 'Times New Roman', serif" font-size="66">
    <tspan x="84" dy="0">I’m building systems that</tspan>
    <tspan x="84" dy="82">consider the </tspan><tspan fill="#d9a05b" font-style="italic">whole person.</tspan>
  </text>

  <text x="84" y="452" fill="#b8b1a2" font-family="Georgia, 'Times New Roman', serif" font-size="27">
    <tspan x="84" dy="0">You can become an expert on yourself, but you can’t be an expert</tspan>
    <tspan x="84" dy="39">on everything your development requires.</tspan>
  </text>

  <line x1="84" y1="542" x2="1116" y2="542" stroke="#35322c" stroke-width="2"/>
  <text x="84" y="576" fill="#8f887a" font-family="Menlo, Monaco, monospace" font-size="16" letter-spacing="1.6">LAURENCEFAVROT.COM</text>
</svg>
